[pytest]
# Pytest Configuration
# Sprint 5-6: Güvenlik ve Stabilite

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Per-test timeout (pytest-timeout)
timeout = 120

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage (isteğe bağlı): pytest --cov=app --cov-report=term-missing --cov-fail-under=50

# Markers
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    fresh_app: test needs its own freshly built app (not the shared session app)

# Coverage options
[coverage:run]
source = app
omit = 
    */tests/*
    */migrations/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
